- name: create file and dir
  hosts: servers
  become: yes

  tasks:
  - name: creating dir with permissions and owner
    ansible.builtin.file:
     path: /tmp/demo
     state: directory
     mode: '0755'
     owner: ansible
     group: ansible

  - name: creating file with permissions and owner
    ansible.builtin.file:
     path: /tmp/demo/sample.txt
     state: touch
     mode: '0644'
     owner: ansible
     group: ansible

  - name: printing message
    debug:
     message: directory and file created
